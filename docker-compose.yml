services:

  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "REDACTED"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: expense_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: expense-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: expense-categorizer-app
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: REDACTED
      MYSQL_PASSWORD: "REDACTED"
      MYSQL_DATABASE: expense_db
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: expenses
    depends_on:
      - mysql
      - mongodb

volumes:
  mysql_data:
  mongo_data: